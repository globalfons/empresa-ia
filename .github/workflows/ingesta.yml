# Workers del motor de ingesta de fuentes oficiales (sin intervención de Claude).
# Fuente → rastreo → descarga → detección de cambios → parseo → extracción → validación → catálogo → web.
# Secretos opcionales (Settings → Secrets and variables → Actions):
#   ANTHROPIC_API_KEY  → activa la extracción con Claude (si falta, se usan solo reglas deterministas)
#   NOTIF_URL, NOTIF_CRON_SECRET → dispara el servicio de notificaciones tras publicar novedades
name: Ingesta de fuentes oficiales
on:
  schedule:
    - cron: "17 5 * * *"   # cada día a las 05:17 UTC
  workflow_dispatch:
    inputs:
      fuente:
        description: "Ejecutar solo esta fuente (id de ingesta/fuentes.json)"
        required: false
permissions:
  contents: write
concurrency:
  group: escritura-repo
  cancel-in-progress: false
jobs:
  ingesta:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      NOTIF_URL: ${{ secrets.NOTIF_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: Dependencias (lectura de PDF y navegador para webs dinámicas)
        run: |
          pip install pypdf
          npm install --no-save playwright@1
          npx playwright install --with-deps chromium
      - name: Rastreo y descarga (fuentes que tocan según su frecuencia)
        run: python3 ingesta/motor.py ${{ github.event.inputs.fuente && format('--fuente {0}', github.event.inputs.fuente) || '' }}
        continue-on-error: true   # una fuente caída no detiene el resto: queda marcada y se reintenta
      - name: Extracción y validación
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python3 ingesta/extraer.py
      - name: Novedades de las oposiciones seguidas (BOE)
        run: python3 catalogo/vigilar_boe.py
        continue-on-error: true
      - name: Novedades de Mossos d'Esquadra (web oficial mossos.gencat.cat) y guía de estudio
        run: |
          sudo apt-get install -y -q poppler-utils >/dev/null
          python3 catalogo/vigilar_gencat.py
          python3 -m ingesta.gencat guia
        continue-on-error: true
      - name: Cambios en las leyes (BOE consolidado) → preguntas a revisar o retiradas
        # Artículo modificado: historial en datos/versiones/, preguntas REVIEW_REQUIRED u OUTDATED y evento LAW_UPDATED
        run: |
          python3 datos/vigilar_leyes.py
          python3 datos/sellar_preguntas.py
        continue-on-error: true
      - name: Validar catálogo y construir la web (y subir el banco premium a Supabase si bancoPrivado está activo)
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python3 catalogo/validar_catalogo.py
          python3 datos/validar_todo.py
          python3 datos/calidad_preguntas.py
          python3 catalogo/construir.py
          node build.mjs
          python3 scripts/subir_banco.py
      - name: Guardar resultados
        run: |
          git config user.name "testley-ingesta"
          git config user.email "testley-ingesta@users.noreply.github.com"
          git add -A ingesta catalogo datos crecimiento/estado docs
          git diff --cached --quiet || git commit -m "Ingesta: $(date -u +%F)"
          for i in 1 2 3; do git pull --rebase -q && git push && break; sleep $((i * 5)); done
      - name: Notificaciones
        if: ${{ env.NOTIF_URL != '' }}
        env:
          NOTIF_CRON_SECRET: ${{ secrets.NOTIF_CRON_SECRET }}
        run: |
          curl -fsS -X POST "$NOTIF_URL" -H "x-cron-secret: $NOTIF_CRON_SECRET" -H "content-type: application/json" -d '{"accion":"ciclo"}'
