# Integración continua: lint, validadores de datos, tests (Python, JS, Deno, SQL contra PostgreSQL) y build.
name: CI
on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "ingesta/estado/**", "ingesta/documentos/**", "ingesta/logs/**", "crecimiento/estado/**"]
  pull_request:
  workflow_dispatch:
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TL_PG: "-h localhost -p 5432 -U postgres"
      PGPASSWORD: postgres
      TL_OUT: /tmp/tl-docs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - uses: denoland/setup-deno@v2
        with: { deno-version: v2.x }
      - name: Guia d'estudi oficial de Mossos (es descarrega de la font oficial; no es versiona)
        run: sudo apt-get install -y -q poppler-utils >/dev/null && python3 -m ingesta.gencat guia
      - run: npm run lint
      - run: npm run validar
      - run: npm run test:py
      - run: deno check supabase/functions/*/index.ts
      - run: deno test --allow-env tests/deno/
      - run: python3 -W ignore -m unittest tests.test_sql
      - run: python3 catalogo/construir.py && node build.mjs   # a /tmp/tl-docs: comprueba que la build no falla sin tocar docs/
      - run: node --test tests/js/store.test.mjs tests/js/eventos.test.mjs tests/js/estudio.test.mjs
